spring.application.name=userservice

# ==========================
# Kafka Configuration
# ==========================
spring.kafka.bootstrap-servers=192.168.56.101:9092

spring.kafka.consumer.group-id=userinfo-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=45000

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.kartik.userservice.desrializer.UserInfoDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.kartik.userservice
spring.kafka.consumer.properties.spring.json.type.mapping=auth:com.kartik.userservice.entities.UserInfoDto

spring.kafka.topic-json.name=user_service

# ==========================
# MySQL Configuration
# ==========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.56.101:3306/userservice?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=test
spring.datasource.password=Password@123

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Optional
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================
# Server
# ==========================
server.port=9810

# ==========================
# Hikari Connection Pool
# ==========================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

# ==========================
# Logging
# ==========================
logging.level.org.springframework.security=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG