spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://192.168.56.101:3306/authservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=test
spring.datasource.password=Password@123

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.cloud.compatibility-verifier.enabled=false

server.port=9898

logging.level.org.springframework.security=DEBUG

# Kafka Producer Config
spring.kafka.producer.bootstrap-servers=192.168.56.101:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.example.Serializer.UserInfoSerializer

# Custom topic names (define your own property keys)
kafka.topic.name=user_service
spring.kafka.producer.properties.spring.json.type.mapping=auth:authservice.model.UserInfoEvent
